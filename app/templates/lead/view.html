{% extends "base.html" %}
{% block content%}


<table class="table">
    <tr>
    <th>No</th>
    <th>Name</th>
    <th>Email</th>
    <th>Phone</th>
    <th>Created_at</th>
    <th>Project</th>

</tr>
{% for i in data %}
<tr>
    <td>{{loop.index}}</td>
    <td> {{ i.name }}</td>
    <td> {{ i.email }}</td>
    <td>{{ i.phone }}</td>
    <td>{{ i.created_at }}</td>
    <td> {{{{ i.project }}</td>
</tr>
{% endfor %}
</table>
{% endblock %}
