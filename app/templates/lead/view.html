{% extends "base.html" %}
{% block content%}
<style>
    .multiline{
    white-space: pre-wrap;
    }
</style>

<table class="table">
<tr>
    <th>No</th>
    <th>Name</th>
    <th>Email</th>
    <th>Phone</th>
    <th>Created_at</th>
    <th>Project Name</th>
    <th>Matched Keywords</th>
</tr>

{% for i in data %}

<tr>
    <td>{{loop.index}}</td>
    <td> {{ i.name }}</td>
    <td> {{ i.email }}</td>
    <td>{{ i.phone }}</td>
    <td>{{ i.created_at }}</td>
    <td class = "commaSeperated">{{i.project_list}}</td>
    <td>{{ i.match_keywords }}</td>
</tr>

{% endfor %}
</table>
<script>
    var div_list = document.querySelectorAll('.commaSeperated');
    console.log(div_list);
    var div_array = [...div_list];
    console.log(div_array); 
    div_array.forEach(div => {
    var alldata = div.textContent.trim().split(',');
    var separateList = '<ul>';
    alldata.forEach(function(value) {
    separateList += '<li>' + value + '</li>';
    });
    separateList += '</ul>';
    div.innerHTML = separateList;
    });
</script>
{% endblock %}
