# Full stack: web app behind nginx, Redis broker, and the Celery workers + scheduler.
# Settings come from .env (copy .env.example). MongoDB is external (e.g. Atlas), set by MONGO_URI.
services:
  redis:
    image: redis:7
    restart: always

  flask:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - storage:/opt/lead_automation/storage
    depends_on:
      - redis

  nginx:
    build: ./nginx
    restart: always
    ports:
      - "8005:80"
    depends_on:
      - flask

  lead_worker:
    build: .
    entrypoint: ["./worker_starter.sh", "lead"]
    restart: always
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  browser_worker:
    build: .
    entrypoint: ["./worker_starter.sh", "browser"]
    restart: always
    shm_size: 1gb
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - storage:/opt/lead_automation/storage
    depends_on:
      - redis

  bulk_worker:
    build: .
    entrypoint: ["./worker_starter.sh", "bulk"]
    restart: always
    shm_size: 1gb
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - storage:/opt/lead_automation/storage
    depends_on:
      - redis

  api_worker:
    build: .
    entrypoint: ["./worker_starter.sh", "api"]
    restart: always
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  beat:
    build: .
    entrypoint: ["./worker_starter.sh", "beat"]
    restart: always
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

volumes:
  storage:
