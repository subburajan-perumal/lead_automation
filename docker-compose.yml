version: '3.7'
services:
  #browser
  firefox:
    image: selenium/node-firefox
    container_name: webautomation_firefox
    depends_on:
      - hub
    environment:
      HUB_PORT_4444_TCP_ADDR: hub
      HUB_PORT_4444_TCP_PORT: 4444
      NODE_MAX_SESSION: 2
      NODE_MAX_INSTANCES: 2
    volumes:
      - /dev/shm:/dev/shm
    ports:
      - "8006:4444"
      
    links:
     - hub

  redis:
    image: redis
    ports:
      - "8001:6379"

  nginx:
    build: ./nginx
    # container_name: nginx
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    ports:
      - "8005:80"
    networks:
      - hubnet

  hub:
    image: selenium/hub
    environment:
      GRID_MAX_SESSION: 4
      GRID_BROWSER_TIMEOUT: 10000
      GRID_TIMEOUT: 3000
    
    
  flask:
    build: .
    # container_name: gunicorn
    # expose:
    #   - 5000
    ports:
      - 5000:5000
    restart: always
    environment:
      - MONGO_DB=REDACTED
    env_file:
      - .env
    # volumes:
    #   - /opt/lead_automation/logs:./logs/
    depends_on:
      - redis
      - nginx
    networks:
      - hubnet
  
      

networks:
  hubnet:
    driver: bridge


